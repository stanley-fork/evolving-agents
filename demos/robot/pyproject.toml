[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "evolving-robot"
version = "0.0.1"
description = "A 2D patrol robot that autonomously evolves its own skills, driven by Gemma 4 (AI Studio, no GPU), orchestrated by odyssey, gated by skill-map, and versioned by agentvcs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# odyssey comes from PyPI rather than an editable install of a sibling checkout.
# The old `pip install -e ../odyssey` broke the moment that directory moved and
# left a .pth pointing into thin air, so a fresh clone could not run the demo
# and the failure surfaced as an opaque ImportError.
#
# agentvcs is NOT on PyPI, so it stays an editable install of a sibling
# checkout — see the note in README. Do not add it here until it is published.
dependencies = [
    "httpx>=0.24",
    "websockets>=12.0",
    "numpy>=1.24",          # odyssey's PlannedEvalRuntime imports numpy
    # From git, pinned: the PyPI wheel for 0.1.0a1 ships without
    # odyssey/runners/evals/_common.py, which odyssey_ext/sim2d_runner.py
    # imports. The file is present in the tagged release; the published
    # artifact is incomplete.
    "lovell-odyssey @ git+https://github.com/lovellai-dev/odyssey.git@6402172",
]

# Required because lovell-odyssey is pinned to a git commit above.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["robot_brain"]
