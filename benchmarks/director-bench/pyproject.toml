[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "director-bench"
version = "0.1.0"
description = "Does Claude Code get better from one session to the next on recurring tasks?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bench = "runner.cli:main"

[tool.setuptools]
packages = ["runner", "metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
